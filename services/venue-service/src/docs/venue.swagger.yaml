paths:
  /venues:
    get:
      summary: Get all approved venues
      description: Retrieve a list of all approved venues with their amenities and capacities.
      tags: [Venues]
      responses:
        200:
          description: A list of venues
  /venues/{id}:
    get:
      summary: Get a venue by ID
      description: Retrieve a specific venue by its ID.
      tags: [Venues]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The venue ID
      responses:
        200:
          description: Venue details
        400:
          description: Invalid venue ID format
        404:
          description: Venue not found

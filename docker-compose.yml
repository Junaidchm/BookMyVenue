version: '3.8'

services:
  # Relational Database Engine with Spatial Extensions
  bmv_db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: bmv_dev_user
      POSTGRES_PASSWORD: bmv_ssh
      POSTGRES_DB: bmv_db
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql
    networks:
      - bmv-mesh-network

  # Core UI Layout & Gateway Proxy Router
  frontend-gateway:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - bmv-mesh-network

  # API Gateway: Single entry point and routing proxy
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      JWT_SECRET: secret
      AUTH_SERVICE_URL: http://auth-service:5003
      VENUE_SERVICE_URL: http://venue-service:5001
      BOOKING_SERVICE_URL: http://booking-service:5002
    depends_on:
      - auth-service
      - venue-service
      - booking-service
    networks:
      - bmv-mesh-network

  # Microservice 1: Proximity Feeds & Location Indexes
  venue-service:
    build: ./services/venue-service
    environment:
      DATABASE_URL: postgres://bmv_dev_user:bmv_ssh@bmv_db:5432/bmv_venue
    depends_on:
      - bmv_db
    networks:
      - bmv-mesh-network

  # Microservice 2: Availability Grids & Reservation States
  booking-service:
    build: ./services/booking-service
    environment:
      DATABASE_URL: postgres://bmv_dev_user:bmv_ssh@bmv_db:5432/bmv_booking
    depends_on:
      - bmv_db
    networks:
      - bmv-mesh-network

  # Microservice 3: Decoupled Authentication & Identity Tokens
  auth-service:
    build: ./services/auth-service
    environment:
      DATABASE_URL: postgres://bmv_dev_user:bmv_ssh@bmv_db:5432/bmv_auth
      JWT_SECRET: secret
    depends_on:
      - bmv_db
    networks:
      - bmv-mesh-network

networks:
  bmv-mesh-network:
    driver: bridge

paths:
  /venues:
    get:
      summary: Get all approved venues
      description: Retrieve a list of all approved venues with their amenities, capacities, and sessions. Only venues with status `APPROVED` are returned, ordered by creation date (newest first).
      tags: [Venues]
      responses:
        200:
          description: A list of approved venues
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Venue'

    post:
      summary: Create a new venue
      description: |
        Creates a new venue with its related records (capacities, sessions, amenities) in a single atomic transaction.
        Requires the `OWNER` role (enforced via the `x-user-roles` header injected by the API gateway).
        The venue is created with a default status of `PENDING` and must be approved by an admin before it appears in public listings.
      tags: [Venues]
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRoles'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVenueRequest'
      responses:
        201:
          description: Venue created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Venue'
        400:
          description: Validation failed or invalid user identity context
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        403:
          description: Forbidden — user does not have the OWNER role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /venues/{id}:
    get:
      summary: Get a venue by ID
      description: Retrieve a specific venue by its ID, including all related amenities, capacities, and sessions. Returns venues of any status (PENDING, APPROVED, REJECTED).
      tags: [Venues]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The venue ID
      responses:
        200:
          description: Venue details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Venue'
        400:
          description: Invalid venue ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: Venue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /venues/uploads/signature:
    post:
      summary: Get Cloudinary upload signature
      description: |
        Generates a signed Cloudinary upload signature for direct client-side image uploads.
        The frontend uses the returned credentials (signature, timestamp, apiKey, cloudName, uploadPreset) to upload images directly to Cloudinary without proxying through the backend.
        Requires the `OWNER` role.
      tags: [Uploads]
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRoles'
      responses:
        200:
          description: Upload signature generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CloudinarySignatureResponse'
        403:
          description: Forbidden — user does not have the OWNER role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    XUserId:
      in: header
      name: x-user-id
      required: true
      schema:
        type: integer
      description: Authenticated user ID (injected by the API gateway)
    XUserRoles:
      in: header
      name: x-user-roles
      required: true
      schema:
        type: string
        example: OWNER,USER
      description: Comma-separated user roles (injected by the API gateway). Must include `OWNER` for protected endpoints.

  schemas:
    # ── Request Schemas ──────────────────────────────────

    CreateVenueRequest:
      type: object
      required:
        - title
        - category
        - basePrice
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 255
          example: Grand Sapphire Banquet Hall
        description:
          type: string
          nullable: true
          example: A luxurious banquet hall with a seating capacity of 500 guests.
        category:
          type: string
          example: wedding_hall
          description: "Venue category (e.g., 'auditorium', 'wedding_hall', 'cafe')"
        basePrice:
          type: number
          format: double
          example: 25000.00
          description: Base price for the venue (must be positive)
        pricingType:
          type: string
          enum: [PER_HOUR, PER_SESSION]
          default: PER_HOUR
          description: Pricing model. When set to `PER_SESSION`, at least one session must be provided.
        bufferTimeMinutes:
          type: integer
          minimum: 0
          default: 60
          description: Buffer time in minutes between bookings for turnaround
        imageUrls:
          type: array
          items:
            type: string
            format: uri
          default: []
          example:
            - https://res.cloudinary.com/demo/image/upload/v1/venues/hall1.jpg
            - https://res.cloudinary.com/demo/image/upload/v1/venues/hall2.jpg
        amenities:
          type: array
          items:
            type: integer
            description: Amenity ID (must reference an existing amenity)
          default: []
          example: [1, 3, 5]
        capacities:
          type: array
          items:
            $ref: '#/components/schemas/CapacityInput'
          default: []
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionInput'
          default: []
          description: Required when pricingType is `PER_SESSION`

    CapacityInput:
      type: object
      required:
        - type
        - maxPeople
      properties:
        type:
          type: string
          example: SEATING
          description: "Capacity arrangement type (e.g., 'SEATING', 'DINING', 'FLOATING')"
        maxPeople:
          type: integer
          minimum: 1
          example: 300
        isSeparate:
          type: boolean
          default: false
          description: Whether this capacity profile is for a separate/independent area

    SessionInput:
      type: object
      required:
        - name
        - startTime
        - endTime
        - sessionPrice
      properties:
        name:
          type: string
          example: Morning
        startTime:
          type: string
          pattern: '^([0-9]|0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$'
          example: "08:00"
          description: Session start time in HH:MM (24-hour) format
        endTime:
          type: string
          pattern: '^([0-9]|0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$'
          example: "13:00"
          description: Session end time in HH:MM (24-hour) format
        sessionPrice:
          type: number
          format: double
          example: 15000.00

    # ── Response Schemas ─────────────────────────────────

    Venue:
      type: object
      properties:
        id:
          type: integer
          example: 1
        ownerId:
          type: integer
          example: 42
        title:
          type: string
          example: Grand Sapphire Banquet Hall
        description:
          type: string
          nullable: true
          example: A luxurious banquet hall with a seating capacity of 500 guests.
        category:
          type: string
          example: wedding_hall
        basePrice:
          type: string
          description: Decimal value returned as a string by Prisma
          example: "25000.00"
        pricingType:
          type: string
          enum: [PER_HOUR, PER_SESSION]
          example: PER_HOUR
        bufferTimeMinutes:
          type: integer
          example: 60
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
          example: PENDING
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        amenities:
          type: array
          items:
            $ref: '#/components/schemas/VenueAmenityRelation'
        capacities:
          type: array
          items:
            $ref: '#/components/schemas/VenueCapacity'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/VenueSession'

    VenueAmenityRelation:
      type: object
      properties:
        venueId:
          type: integer
        amenityId:
          type: integer
        amenity:
          $ref: '#/components/schemas/Amenity'

    Amenity:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Wi-Fi
        iconKey:
          type: string
          nullable: true
          example: wifi

    VenueCapacity:
      type: object
      properties:
        id:
          type: integer
        venueId:
          type: integer
        type:
          type: string
          example: SEATING
        maxPeople:
          type: integer
          example: 300
        isSeparate:
          type: boolean
          example: false

    VenueSession:
      type: object
      properties:
        id:
          type: integer
        venueId:
          type: integer
        name:
          type: string
          example: Morning
        startTime:
          type: string
          example: "08:00"
        endTime:
          type: string
          example: "13:00"
        sessionPrice:
          type: string
          description: Decimal value returned as a string by Prisma
          example: "15000.00"

    CloudinarySignatureResponse:
      type: object
      properties:
        signature:
          type: string
          description: SHA-1 HMAC signature for Cloudinary upload
          example: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
        timestamp:
          type: integer
          description: Unix timestamp (seconds) used in signature generation
          example: 1718789100
        apiKey:
          type: string
          description: Cloudinary API key
          example: "123456789012345"
        cloudName:
          type: string
          description: Cloudinary cloud name
          example: my-cloud
        uploadPreset:
          type: string
          description: Cloudinary upload preset name
          example: venue_preset

    # ── Error Schemas ────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Forbidden — Access restricted to venue owners.

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          description: Zod validation error details
          items:
            type: object
            properties:
              code:
                type: string
                example: too_small
              minimum:
                type: integer
                example: 3
              path:
                type: array
                items:
                  type: string
                example: [body, title]
              message:
                type: string
                example: Title must be at least 3 characters long

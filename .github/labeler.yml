frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/**"
          - "src/app/**"

backend:
  - changed-files:
      - any-glob-to-any-file:
          - "src/server/**"
          - "src/api/**"

database:
  - changed-files:
      - any-glob-to-any-file:
          - "prisma/**"
          - "drizzle/**"

auth:
  - changed-files:
      - any-glob-to-any-file:
          - "src/lib/auth/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

ci-cd:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"